<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 900px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .btn-edit { background-color: #ffc107; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">Hệ thống Quản lý Sinh viên</h2>

    <form id="studentForm" class="row g-3 mb-4">
        <input type="hidden" id="editIndex" value="-1">
        <div class="col-md-3">
            <input type="text" id="maSV" class="form-control" placeholder="Mã SV" required>
        </div>
        <div class="col-md-5">
            <input type="text" id="hoTen" class="form-control" placeholder="Họ và tên" required>
        </div>
        <div class="col-md-4">
            <input type="date" id="ngaySinh" class="form-control" required>
        </div>
        <div class="col-md-4">
            <input type="text" id="lopHoc" class="form-control" placeholder="Lớp học" required>
        </div>
        <div class="col-md-4">
            <input type="number" step="0.1" id="gpa" class="form-control" placeholder="Điểm GPA" required>
        </div>
        <div class="col-md-4">
            <button type="submit" id="submitBtn" class="btn btn-primary w-100">Thêm Sinh viên</button>
        </div>
    </form>

    <hr>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ Tên</th>
                <th>Ngày Sinh</th>
                <th>Lớp</th>
                <th>GPA</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
            </tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
