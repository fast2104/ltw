<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Profile Nguyễn Tuấn Phát</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .main-card {
            width: 900px;
            border: 3px solid #3498db;
            border-radius: 20px;
            padding: 40px;
            background-color: #ecf0f1;
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }
        .cot-trai {
            display: flex;
            flex-direction: column;
            align-items: center; 
            width: 300px;
        }

        .avatar {
            width: 220px;
            height: 220px;
            border-radius: 50%; /* Làm tròn */
            object-fit: cover;
            border: 5px solid #fff;
            margin-bottom: 20px; 
            z-index: 2; 
        }
        .card-lien-he {
            background-color: #64ACE2;
            width: 100%;
            padding: 30px 20px;
            border-radius: 20px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .email-text {
            font-size: 14px;
            margin-bottom: 20px;
            font-style: italic; /* Chữ nghiêng */
        }

        .btn-fb {
            display: inline-block;
            background-color: #E0E0E0; 
            color: #333;
            text-decoration: none;
            padding: 10px 40px;
            border-radius: 15px;
            font-weight: 600;
            font-style: italic;
            transition: 0.3s;
        }

        .btn-fb:hover {
            background-color: #d1d1d1;
        }
        .cot-phai {
            flex: 1; 
            display: flex;
            align-items: center; 
            height: 100%;
            padding-top: 60px; 
        }

        .card-thong-tin {
            background-color: #C8CDD6; 
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            color: #2c3e50;
        }

        .info-line {
            margin-bottom: 10px;
            font-size: 18px;
            line-height: 1.6;
        }

        .info-line i {
            font-weight: 600;
        }
    </style>
</head>
